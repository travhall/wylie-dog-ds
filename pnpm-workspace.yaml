packages:
  - apps/*
  - packages/*

catalog:
  eslint: ^10.12.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  # Pinned exact (not ^) -- TypeScript 7.x has caused real compatibility
  # issues when upgrading this and other projects. Confirm what actually
  # broke before attempting a 7.x bump.
  typescript: 6.0.3
  vite: ^8.3.4
  vitest: ^5.0.4

# serve@14.2.6 (latest) pins compression 1.8.1, which has a DoS advisory
# (GHSA-vc2v-76pw-4v95, fixed in 1.8.2). Remove once serve ships a fix.
overrides:
  compression: '>=1.8.2'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
  - unrs-resolver

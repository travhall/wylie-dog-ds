name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "packages/tokens/io/sync/**"
  push:
    branches:
      - main
    paths-ignore:
      - "packages/tokens/io/sync/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # The apt mirrors fail now and then ("Failed to fetch ... Temporary failure"), which used to
        # fail the whole job, so try three times, refreshing the package lists in between.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter storybook exec playwright install chromium --with-deps && exit 0
            echo "Playwright install failed (attempt $attempt), retrying in 20s"
            sudo apt-get update || true
            sleep 20
          done
          exit 1

      # Consolidated per Plan 078 (deduplicate the test workflow runs): `test`,
      # `test:a11y`, and `test:coverage` all ran the same Vitest file set
      # sequentially (test:a11y's a11y specs are already matched by the
      # default `include` globs, and test:coverage is `test` + `--coverage`).
      # `test:coverage` alone produces every prior output: full suite pass,
      # a11y assertions, and the coverage report. Tradeoff: a failure here no
      # longer tells you from the step name alone whether it was a plain
      # test, an a11y assertion, or a coverage-generation failure — check the
      # Vitest output in this step's log instead.
      - name: Run Tests with Coverage
        run: pnpm test:coverage

      # `test:coverage` only exists in packages/ui and figma-plugin, so the showcase's own
      # suite (page renders, the Storybook link builder, the search index) did not run on
      # pull requests: a broken Storybook link sat on main unnoticed. It needs no build,
      # since its vitest config resolves @wyliedog/ui to source and packages/tokens/dist is
      # committed. `!cancelled()` keeps it running when the step above fails, so one
      # failure does not hide the other.
      - name: Run Showcase Tests
        if: ${{ !cancelled() }}
        run: pnpm --filter showcase test

      # Runs the UI coverage on its own (about 25s) instead of reusing the
      # step above: turbo stops that step when any package fails its coverage
      # threshold, which would leave no packages/ui/coverage/coverage-summary.json to
      # check. Fails if the percentages in
      # documentation/reference/testing-coverage.md no longer match the run.
      - name: Check coverage docs
        if: ${{ !cancelled() }}
        run: pnpm check:docs:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/ui/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

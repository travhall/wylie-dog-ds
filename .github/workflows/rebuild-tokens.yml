name: Rebuild Tokens

on:
  push:
    branches:
      - main
    paths:
      - "packages/tokens/io/sync/**/*.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-tokens:
    name: Rebuild Design Tokens
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: store_path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.store_path.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Tokens
        run: pnpm --filter @wyliedog/tokens build

      - name: Validate Rebuilt Tokens
        run: pnpm --filter @wyliedog/tokens test:tokens

      - name: Typecheck Downstream Consumers
        run: pnpm --filter @wyliedog/ui typecheck

      - name: Check for Changes
        id: check_changes
        run: |
          if git diff --quiet packages/tokens/io/processed/ packages/tokens/dist/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected in processed tokens or dist files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in processed tokens or dist files"
          fi

      - name: Commit Rebuilt Tokens
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/tokens/io/processed/ packages/tokens/dist/
          git commit -m "chore: rebuild tokens from Figma sync" \
            -m "Automatically rebuilt design tokens after changes to io/sync files." \
            -m "🤖 Generated by GitHub Actions" \
            --no-verify
          git push

  # Pushes made with the default GITHUB_TOKEN do not start other workflows, so
  # the rebuild commit above never reaches lint.yml, build.yml or test.yml.
  # This job runs the same checks against the rebuilt main instead. It uses
  # the default token only (no extra secret) and is skipped when nothing was
  # pushed.
  verify-rebuild:
    name: Verify Rebuilt Tokens
    needs: rebuild-tokens
    if: needs.rebuild-tokens.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout rebuilt main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Build packages
        run: pnpm turbo run build --filter=@wyliedog/ui --filter=@wyliedog/tokens

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Check token references and contrast
        run: |
          pnpm check:tokens
          pnpm check:contrast

      - name: Build All Packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter storybook exec playwright install chromium --with-deps

      - name: Run Tests
        run: pnpm test
